# ===================================================================
# MICROSERVICIO 3: AGENCIAS Y CATALOGO - HUILA TRAVEL EXPEDITION
# Paquete Base: com.oteca.agenciascatalogo
# ===================================================================
spring.application.name=ms-agencias-catalogo
server.port=8083

# 1. Configuracion de Base de Datos Aislada (MySQL - Database per Service)
spring.datasource.url=jdbc:mysql://localhost:3306/db_hte_agencias_catalogo?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 2. Validacion Estricta de Esquema con Hibernate (Obligatorio segun Guia Fase 1)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 3. Configuracion de Migraciones con Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# 4. Configuracion de Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
